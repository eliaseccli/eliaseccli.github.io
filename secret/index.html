<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#050508">
  <meta name="color-scheme" content="dark">
  <title>Elias Eccli</title>
  <style>
    :root { --ink: rgba(255,255,255,0.82); --mute: rgba(255,255,255,0.48); }
    html, body { height: 100%; margin: 0; background: #050508; color: var(--ink);
      font-family: "SF Pro Display", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .wrap { width: min(28rem, 100%); }
    h1 { margin: 0 0 0.35rem; font-weight: 560; letter-spacing: -0.03em; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .lede { margin: 0 0 1.4rem; color: var(--mute); font-size: 0.95rem; }
    ol { margin: 0 0 1.5rem; padding: 0 0 0 1.35rem; }
    ol li { padding: 0.45rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 1.05rem; }
    ol li:first-child { border-top: 1px solid rgba(255,255,255,0.06); }
    .empty { color: var(--mute); font-size: 0.92rem; margin: 0 0 1.5rem; }
    form { display: flex; gap: 0.55rem; }
    form[hidden] { display: none; }
    input {
      flex: 1; min-width: 0; padding: 0.72rem 0.95rem; font: inherit; font-size: 1rem;
      color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; outline: none;
      backdrop-filter: blur(22px) saturate(1.55); -webkit-backdrop-filter: blur(22px) saturate(1.55);
    }
    input:focus { border-color: rgba(190, 220, 255, 0.55); }
    button {
      padding: 0.72rem 1.05rem; font: inherit; font-size: 0.95rem; color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .hint { margin: 0.65rem 0 0; min-height: 1.1em; font-size: 0.78rem; color: rgba(255,255,255,0.38); text-align: center; }
  </style>
  <script>
    (function () {
      var ok = false;
      try { ok = sessionStorage.getItem("homeSecret") === "1"; } catch (e) {}
      if (!ok) location.replace("../");
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>secret page</h1>
    <p class="lede">Hall of fame. You found it.</p>
    <ol data-list></ol>
    <p class="empty" data-empty hidden>Nobody on the wall yet.</p>
    <form data-form autocomplete="off">
      <input data-name type="text" name="n" maxlength="24" placeholder="Name or nickname" autocapitalize="on" autocomplete="nickname" spellcheck="false">
      <button type="submit">Add</button>
    </form>
    <p class="hint" data-hint></p>
  </div>
  <script>
    (function () {
      var API = "https://hof.eliaseccli.workers.dev";
      var KEY = "secretHof.signed";
      var listEl = document.querySelector("[data-list]");
      var emptyEl = document.querySelector("[data-empty]");
      var form = document.querySelector("[data-form]");
      var input = document.querySelector("[data-name]");
      var hint = document.querySelector("[data-hint]");
      var btn = form.querySelector("button");

      function paint(names, signed) {
        listEl.innerHTML = "";
        names.forEach(function (row) {
          var li = document.createElement("li");
          li.textContent = row.name;
          listEl.appendChild(li);
        });
        emptyEl.hidden = names.length > 0;
        var local = false;
        try { local = sessionStorage.getItem(KEY) === "1" || localStorage.getItem(KEY) === "1"; } catch (e) {}
        form.hidden = Boolean(signed || local);
      }

      function load() {
        return fetch(API, { method: "GET" }).then(function (r) { return r.json(); }).then(function (data) {
          paint(data.names || [], data.signed);
        }).catch(function () {
          hint.textContent = "Hall is sleeping. Try again in a bit.";
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        hint.textContent = "";
        btn.disabled = true;
        fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: input.value })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; }); })
        .then(function (res) {
          if (res.ok) {
            try { localStorage.setItem(KEY, "1"); } catch (err) {}
            paint(res.data.names || [], true);
            hint.textContent = "";
            return;
          }
          if (res.status === 409) {
            try { localStorage.setItem(KEY, "1"); } catch (err) {}
            form.hidden = true;
            hint.textContent = "This connection already signed.";
            return load();
          }
          if (res.data && res.data.error === "name") hint.textContent = "2–24 letters, numbers, spaces.";
          else hint.textContent = "Couldn’t add that.";
        }).catch(function () {
          hint.textContent = "Couldn’t add that.";
        }).then(function () { btn.disabled = false; });
      });

      load();
    })();
  </script>

</body>
</html>
