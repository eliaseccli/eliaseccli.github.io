<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla in Austria · Voronoi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    * { box-sizing: border-box; }
    html, body, #map {
      height: 100%;
      margin: 0;
      background: #f4f4f4;
    }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #bar {
      position: absolute;
      top: 12px;
      left: 4.6rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
      max-width: calc(100% - 5.4rem);
      padding: 0.5rem 0.85rem;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }
    #bar-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    #overlays {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
    }
    #bar a {
      color: #666;
      font-size: 0.8125rem;
      text-decoration: none;
      white-space: nowrap;
    }
    #bar a:hover { color: #111; }
    #bar h1 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #222;
      line-height: 1.35;
    }
    #overlay-toggle, .overlay-toggle {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 400;
      color: #222;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    #overlay-toggle input, .overlay-toggle input {
      margin: 0;
    }
    .leaflet-popup-content {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .leaflet-popup-content strong { display: block; margin-bottom: 0.2rem; }
.nav {
  position: fixed;
  top: max(0.9rem, calc(env(safe-area-inset-top) + 0.55rem));
  left: max(0.9rem, calc(env(safe-area-inset-left) + 0.55rem));
  z-index: 1100;
}

.nav-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 2.45rem;
  height: 2.45rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 0.58rem 0.52rem;
  margin: 0;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 0.72rem;
  background: transparent;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 10px 28px rgba(0, 0, 0, 0.28);
  cursor: pointer;
}

.nav-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(22px) saturate(1.55);
  -webkit-backdrop-filter: blur(22px) saturate(1.55);
  pointer-events: none;
}

.nav-btn span {
  display: block;
  width: 100%;
  height: 1.5px;
  flex: 0 0 1.5px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.82);
  transform-origin: center;
  transition: transform 0.22s ease, opacity 0.18s ease;
}

.nav.is-open .nav-btn span:nth-of-type(1) { transform: translateY(6.5px) rotate(45deg); }
.nav.is-open .nav-btn span:nth-of-type(2) {
  opacity: 0;
  visibility: hidden;
  transform: scaleX(0);
}
.nav.is-open .nav-btn span:nth-of-type(3) { transform: translateY(-6.5px) rotate(-45deg); }
