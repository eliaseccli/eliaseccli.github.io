  <style>
    * { box-sizing: border-box; }
    html, body, #map {
      height: 100%;
      margin: 0;
      background: #f4f4f4;
    }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #bar {
      position: absolute;
      top: 12px;
      left: 4.6rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
      max-width: calc(100% - 5.4rem);
      padding: 0.5rem 0.85rem;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }
    #bar-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    #overlays {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
    }
    #bar a {
      color: #666;
      font-size: 0.8125rem;
      text-decoration: none;
      white-space: nowrap;
    }
    #bar a:hover { color: #111; }
    #bar h1 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #222;
      line-height: 1.35;
    }
    #overlay-toggle, .overlay-toggle {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 400;
      color: #222;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    #overlay-toggle input, .overlay-toggle input {
      margin: 0;
      width: 1.1rem;
      height: 1.1rem;
    }
    .overlay-toggle { min-height: 24px; }
    .leaflet-popup-content {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .leaflet-popup-content strong { display: block; margin-bottom: 0.2rem; }
.nav { z-index: 1100; } /* above Leaflet panes */
