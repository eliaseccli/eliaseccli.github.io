<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Look up</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<script src="/projects/unlock.js?v=1"></script>
  <script>
    (function () {
      var ok = false;
      try { ok = !!window.ProjectsUnlock.get(); } catch (e) {}
      if (!ok) {
        try { sessionStorage.setItem("projects.next", location.pathname); } catch (e) {}
        location.replace("../?next=" + encodeURIComponent(location.pathname));
      } else {
        document.documentElement.classList.add("is-open");
      }
    })();
  </script>

  <link rel="stylesheet" href="/nav.css?v=1">
  <link rel="stylesheet" href="./lookup.css?v=nav1">
</head>
<body>
  <video class="cam" data-cam playsinline webkit-playsinline muted autoplay></video>
  <nav class="nav" data-nav>
    <button class="nav-btn" type="button" data-nav-btn aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-list" id="nav-list" hidden></ul>
  </nav>
  <script src="/nav.js?v=1" defer></script>
  <canvas class="sky" data-sky></canvas>
  <div class="hud" data-hud>
    <p class="hud-line" data-sats>Loading orbits…</p>
    <p class="hud-line hud-iss" data-iss hidden></p>
    <p class="hud-line hud-meta" data-place></p>
    <p class="hud-line hud-meta" data-heading></p>
    <div class="hud-actions">
      <button type="button" class="chip" data-loc hidden>Use location</button>
      <button type="button" class="chip" data-compass hidden>Use compass</button>
      <button type="button" class="chip" data-cam-btn hidden>Camera</button>
    </div>
  </div>
  <script src="./lookup.js?v=lookup8"></script>

</body>
</html>
