<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Look up · Elias</title>
  <script>
    (function () {
      var ok = false;
      try { ok = !!sessionStorage.getItem("projects.ok"); } catch (e) {}
      if (!ok) {
        try { sessionStorage.setItem("projects.next", location.pathname); } catch (e) {}
        location.replace("../?next=" + encodeURIComponent(location.pathname));
      } else {
        document.documentElement.classList.add("is-open");
      }
    })();
  </script>
  <link rel="stylesheet" href="./lookup.css?v=lookup2">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="bloom"></div>
    <canvas class="stars"></canvas>
  </div>
  <nav class="nav" data-nav>
    <button class="nav-btn" type="button" data-nav-btn aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-list" id="nav-list" hidden>
      <li><a href="../../">HOME</a></li>
      <li><a href="../../teslastores/">Tesla-Stores</a></li>
      <li><a href="../../starlink/">Starlink</a></li>
      <li><a href="../">Projects</a></li>
      <li><a href="../../about/">About</a></li>
    </ul>
  </nav>
  <canvas class="sky" data-sky></canvas>
  <div class="hud" data-hud>
    <p class="hud-line" data-sats>Loading orbits…</p>
    <p class="hud-line hud-iss" data-iss hidden></p>
    <p class="hud-line hud-meta" data-place></p>
    <p class="hud-line hud-meta" data-heading></p>
    <div class="hud-actions">
      <button type="button" class="chip" data-loc hidden>Use location</button>
      <button type="button" class="chip" data-compass hidden>Use compass</button>
    </div>
  </div>
  <script src="./lookup.js?v=lookup2"></script>

</body>
</html>
