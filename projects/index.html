<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050508">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Elias Eccli</title>
  <link rel="stylesheet" href="./projects.css">
</head>
<body>
  <div class="bloom" aria-hidden="true"></div>
  <canvas class="stars" aria-hidden="true"></canvas>
  <main class="stage">
    <form class="gate" data-gate autocomplete="off">
      <input data-pass type="password" name="p" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
      <p class="hint" data-hint></p>
    </form>
    <div class="panel" data-panel hidden></div>
  </main>
  <script src="./projects.js"></script>
</body>
</html>
