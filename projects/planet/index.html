<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#04040a">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Planet zum Anstupsen · Elias</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/projects/unlock.js?v=1"></script>
  <script>
    (function () {
      var ok = false;
      try { ok = !!window.ProjectsUnlock.get(); } catch (e) {}
      if (!ok) {
        try { sessionStorage.setItem("projects.next", location.pathname); } catch (e) {}
        location.replace("../?next=" + encodeURIComponent(location.pathname));
      } else {
        document.documentElement.classList.add("is-open");
      }
    })();
  </script>
  <link rel="stylesheet" href="./planet.css?v=20261101a">
</head>
<body>
  <canvas id="c" aria-label="Ein kleiner Planet zum Anstupsen"></canvas>
  <a class="back" href="../" aria-label="Zurück zu den Projekten">‹</a>
  <div class="hud">
    <div class="count" data-count>Jahr 0</div>
    <div class="actions">
      <button type="button" data-sound aria-label="Ton aus" title="Ton">🔇</button>
      <button type="button" data-reset title="Neuer Planet">Neu</button>
    </div>
  </div>
  <div class="toast" data-toast></div>
  <button type="button" class="logline" data-logbtn aria-label="Chronik öffnen">📜 <span data-last>Die Chronik ist noch leer.</span></button>
  <div class="log" data-log hidden></div>
  <div class="card" data-card hidden></div>
  <div class="ctrl">
    <label>🌡️ <span>Wärme</span><input type="range" min="0" max="100" value="50" data-warm aria-label="Wärme"></label>
    <label>🌧️ <span>Regen</span><input type="range" min="0" max="100" value="50" data-rain aria-label="Regen"></label>
  </div>
  <nav class="tools" data-tools>
    <button type="button" data-tool="up" class="on" aria-label="Land heben" title="Heben">⬆️</button>
    <button type="button" data-tool="down" aria-label="Land senken" title="Senken">⬇️</button>
    <button type="button" data-tool="look" aria-label="Ansehen" title="Ansehen">🔎</button>
    <span class="sep"></span>
    <button type="button" class="sp" data-speed="0" aria-label="Pause">⏸</button>
    <button type="button" class="sp" data-speed="1" aria-label="Normal">1×</button>
    <button type="button" class="sp" data-speed="5" aria-label="Schneller">5×</button>
    <button type="button" class="sp" data-speed="20" aria-label="Sehr schnell">20×</button>
  </nav>
  <script type="module" src="./planet.js?v=20261101a"></script>
</body>
</html>
