name: Starlink daily refresh

on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet numpy
      - name: Dump sats.json
        env:
          STARLINK_CACHE: ${{ runner.temp }}/starlink
        run: |
          export TZ=Europe/Vienna
          hour=$(date +%H)
          echo "Vienna hour=$hour event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$hour" != "08" ]; then
            echo "Skip: not 08:00 Vienna"
            exit 0
          fi
          PYTHONPATH=starlink python3 -m refresh dump --out starlink/sats.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starlink/sats.json
          if git diff --cached --quiet; then
            echo "No sats.json change"
            exit 0
          fi
          git commit -m "Starlink sats.json daily refresh"
          git push
