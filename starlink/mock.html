<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Starlink 53° 463 km mock</title>
  <style>
    :root { --bg:#050508; --ink:rgba(255,255,255,.86); --mute:rgba(255,255,255,.5); }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--ink);
      font-family:"SF Pro Display","SF Pro Text",system-ui,-apple-system,sans-serif; }
    a { color:inherit; }
    .back { position:fixed; top:16px; left:16px; z-index:3; font-size:.9rem; color:var(--mute); text-decoration:none; }
    .wrap { display:flex; min-height:100dvh; align-items:stretch; }
    .meta { width:min(280px,32vw); padding:4.6rem 1.2rem 2rem 1.4rem; flex-shrink:0; }
    .meta h1 { margin:0 0 .55rem; font-size:1.35rem; font-weight:560; }
    .meta p { margin:0 0 .35rem; font-size:1.05rem; color:var(--mute); }
    .pick { margin-top:1.4rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,.1); min-height:4.5rem; }
    .pick strong { display:block; font-size:1.15rem; margin-bottom:.25rem; }
    .hint { margin-top:1.2rem; font-size:.82rem; color:rgba(255,255,255,.38); line-height:1.35; }
    button.reset { margin-top:.7rem; background:transparent; color:rgba(255,255,255,.7);
      border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:.35rem .7rem;
      font: inherit; font-size:.85rem; cursor:pointer; }
    button.reset:hover { color:#fff; border-color:rgba(255,255,255,.35); }
    .stage { flex:1; position:relative; min-width:0; padding:1.2rem 1.2rem 1.2rem 0; }
    canvas { width:100%; height:auto; display:block; touch-action:none; cursor:grab; background:#0a0a10; border-radius:10px; }
    canvas.drag { cursor:grabbing; }
    @media (max-width:720px) {
      .wrap { flex-direction:column; }
      .meta { width:auto; padding:3.6rem 1rem .4rem; }
      .stage { padding:0 0.6rem 1.2rem; }
    }
  </style>
</head>
<body>
  <a class="back" href="./">← gallery</a>
  <div class="wrap">
    <aside class="meta">
      <h1>Starlink 53° shell</h1>
      <p>463 km (461–464)</p>
      <p data-date></p>
      <p data-time></p>
      <p data-count></p>
      <div class="pick" data-pick>Tap a satellite</div>
      <p class="hint">Scroll or pinch to zoom. Drag to pan.</p>
      <button class="reset" type="button" data-reset>Reset view</button>
    </aside>
    <div class="stage">
      <canvas id="c" width="1400" height="1400"></canvas>
    </div>
  </div>
  <script>
    function plasma(t) {
      t = Math.max(0, Math.min(1, t));
      var r = Math.min(1, 0.15 + 2.2 * t);
      var g = Math.max(0, -0.35 + 1.6 * t);
      var b = t < 0.45 ? 0.85 - 0.3 * t : Math.max(0, 1.55 - 1.9 * t);
      return "rgb(" + ((r*255)|0) + "," + ((g*255)|0) + "," + ((b*255)|0) + ")";
    }
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var data = null, selected = -1;
    var view = { k: 1, tx: 0, ty: 0 };
    var KMIN = 1, KMAX = 28;
    var pointers = {};
    var pinch = null;
    var drag = null;
    var moved = false;

    function pad() { return 56; }
    function cssToCanvas(cssX, cssY) {
      var rect = canvas.getBoundingClientRect();
      return [cssX * canvas.width / rect.width, cssY * canvas.height / rect.height];
    }
    function basePix(x, y) {
      var p = pad(), s = canvas.width - 2 * p;
      return [p + (x / 360) * s, p + (1 - y / 360) * s];
    }
    function toPix(x, y) {
      var b = basePix(x, y);
      return [b[0] * view.k + view.tx, b[1] * view.k + view.ty];
    }
    function fromCanvas(cx, cy) {
      var p = pad(), s = canvas.width - 2 * p;
      var bx = (cx - view.tx) / view.k;
      var by = (cy - view.ty) / view.k;
      return [(bx - p) / s * 360, (1 - (by - p) / s) * 360];
    }
    function clampView() {
      view.k = Math.max(KMIN, Math.min(KMAX, view.k));
      var p = pad(), s = canvas.width - 2 * p;
      var left = p * view.k + view.tx;
      var top = p * view.k + view.ty;
      var right = (p + s) * view.k + view.tx;
      var bottom = (p + s) * view.k + view.ty;
      if (left > p) view.tx += p - left;
      if (top > p) view.ty += p - top;
      if (right < p + s) view.tx += (p + s) - right;
      if (bottom < p + s) view.ty += (p + s) - bottom;
    }
    function zoomAt(cx, cy, factor) {
      var k2 = Math.max(KMIN, Math.min(KMAX, view.k * factor));
      var f = k2 / view.k;
      view.tx = cx - (cx - view.tx) * f;
      view.ty = cy - (cy - view.ty) * f;
      view.k = k2;
      clampView();
    }
    function resetView() {
      view.k = 1; view.tx = 0; view.ty = 0;
      draw();
    }

    function draw() {
      if (!data) return;
      var w = canvas.width, p = pad(), s = w - 2 * p;
      ctx.fillStyle = "#0a0a10";
      ctx.fillRect(0, 0, w, w);
      ctx.strokeStyle = "rgba(255,255,255,.12)";
      ctx.lineWidth = 1;
      ctx.strokeRect(p, p, s, s);
      ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.font = "22px system-ui,sans-serif";
      ctx.fillText("Anomaly (deg)", p + s / 2 - 70, w - 16);
      ctx.save();
      ctx.translate(20, p + s / 2 + 50);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("RAAN (deg)", 0, 0);
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.rect(p, p, s, s);
      ctx.clip();
      var alts = data.sats.map(function (o) { return o.alt; });
      var amin = Math.min.apply(null, alts), amax = Math.max.apply(null, alts);
      var r = Math.max(2.4, Math.min(6.5, 3.2 * Math.pow(view.k, 0.28)));
      for (var i = 0; i < data.sats.length; i++) {
        var sat = data.sats[i];
        var xy = toPix(sat.x, sat.y);
        var t = amax === amin ? 0.5 : (sat.alt - amin) / (amax - amin);
        ctx.fillStyle = plasma(t);
        ctx.beginPath();
        ctx.arc(xy[0], xy[1], r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (selected >= 0) {
        var sat = data.sats[selected];
        var xy = toPix(sat.x, sat.y);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(xy[0], xy[1], r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "26px system-ui,sans-serif";
        ctx.fillText(sat.name, xy[0] + 12, xy[1] - 10);
      }
      ctx.restore();
    }

    function nearest(cssX, cssY) {
      var cxy = cssToCanvas(cssX, cssY);
      var xy = fromCanvas(cxy[0], cxy[1]);
      var best = -1, bestD = 1e9;
      for (var i = 0; i < data.sats.length; i++) {
        var dx = data.sats[i].x - xy[0], dy = data.sats[i].y - xy[1];
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      var pix = toPix(data.sats[best].x, data.sats[best].y);
      var distPx = Math.hypot(pix[0] - cxy[0], pix[1] - cxy[1]);
      var rect = canvas.getBoundingClientRect();
      var cssDist = distPx * (rect.width / canvas.width);
      return cssDist <= 18 ? best : -1;
    }

    function showPick(i) {
      var el = document.querySelector("[data-pick]");
      if (i < 0) { el.textContent = "Tap a satellite"; return; }
      var sat = data.sats[i];
      el.innerHTML = "<strong>" + sat.name + "</strong>" + sat.alt.toFixed(1) + " km · NORAD " + sat.id;
    }

    function eventCss(e) {
      var rect = canvas.getBoundingClientRect();
      return [e.clientX - rect.left, e.clientY - rect.top];
    }

    canvas.addEventListener("wheel", function (e) {
      e.preventDefault();
      var css = eventCss(e);
      var cxy = cssToCanvas(css[0], css[1]);
      zoomAt(cxy[0], cxy[1], e.deltaY < 0 ? 1.12 : 1 / 1.12);
      draw();
    }, { passive: false });

    canvas.addEventListener("pointerdown", function (e) {
      canvas.setPointerCapture(e.pointerId);
      var css = eventCss(e);
      pointers[e.pointerId] = { x: css[0], y: css[1] };
      var ids = Object.keys(pointers);
      if (ids.length === 2) {
        var a = pointers[ids[0]], b = pointers[ids[1]];
        pinch = {
          dist: Math.hypot(a.x - b.x, a.y - b.y),
          mx: (a.x + b.x) / 2,
          my: (a.y + b.y) / 2,
          k: view.k, tx: view.tx, ty: view.ty
        };
        drag = null;
      } else {
        drag = { x: css[0], y: css[1], tx: view.tx, ty: view.ty };
        moved = false;
      }
    });

    canvas.addEventListener("pointermove", function (e) {
      if (!pointers[e.pointerId]) return;
      var css = eventCss(e);
      pointers[e.pointerId] = { x: css[0], y: css[1] };
      var ids = Object.keys(pointers);
      if (pinch && ids.length === 2) {
        var a = pointers[ids[0]], b = pointers[ids[1]];
        var dist = Math.hypot(a.x - b.x, a.y - b.y);
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var cxy = cssToCanvas(pinch.mx, pinch.my);
        view.k = pinch.k;
        view.tx = pinch.tx;
        view.ty = pinch.ty;
        if (pinch.dist > 4) zoomAt(cxy[0], cxy[1], dist / pinch.dist);
        var nxy = cssToCanvas(mx, my);
        var oxy = cssToCanvas(pinch.mx, pinch.my);
        view.tx += nxy[0] - oxy[0];
        view.ty += nxy[1] - oxy[1];
        clampView();
        moved = true;
        draw();
        return;
      }
      if (drag && ids.length === 1) {
        var dx = css[0] - drag.x, dy = css[1] - drag.y;
        if (Math.hypot(dx, dy) > 6) {
          moved = true;
          canvas.classList.add("drag");
        }
        if (moved) {
          var c0 = cssToCanvas(drag.x, drag.y);
          var c1 = cssToCanvas(css[0], css[1]);
          view.tx = drag.tx + (c1[0] - c0[0]);
          view.ty = drag.ty + (c1[1] - c0[1]);
          clampView();
          draw();
        }
      }
    });

    function endPtr(e) {
      var css = eventCss(e);
      delete pointers[e.pointerId];
      var ids = Object.keys(pointers);
      if (ids.length < 2) pinch = null;
      if (ids.length === 1) {
        var p = pointers[ids[0]];
        drag = { x: p.x, y: p.y, tx: view.tx, ty: view.ty };
      }
      if (ids.length === 0) {
        canvas.classList.remove("drag");
        if (!moved && !pinch) {
          selected = nearest(css[0], css[1]);
          showPick(selected);
          draw();
        }
        drag = null;
        moved = false;
      }
    }
    canvas.addEventListener("pointerup", endPtr);
    canvas.addEventListener("pointercancel", endPtr);
    canvas.addEventListener("dblclick", function (e) {
      e.preventDefault();
      resetView();
    });
    document.querySelector("[data-reset]").addEventListener("click", resetView);

    fetch("./inc53_shell463.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        data = j;
        var d = new Date(j.epoch);
        document.querySelector("[data-date]").textContent = d.toISOString().slice(0, 10);
        document.querySelector("[data-time]").textContent = d.toISOString().slice(11, 16) + " UTC";
        document.querySelector("[data-count]").textContent = j.n + " Satellites";
        draw();
      });
  </script>
</body>
</html>
