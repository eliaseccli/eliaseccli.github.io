<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14131f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Plop · Elias</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/projects/unlock.js?v=1"></script>
  <script>
    (function () {
      var ok = false;
      try { ok = !!window.ProjectsUnlock.get(); } catch (e) {}
      if (!ok) {
        try { sessionStorage.setItem("projects.next", location.pathname); } catch (e) {}
        location.replace("../?next=" + encodeURIComponent(location.pathname));
      } else {
        document.documentElement.classList.add("is-open");
      }
    })();
  </script>
  <link rel="stylesheet" href="./plop.css?v=4">
</head>
<body>
  <canvas id="c" aria-label="Letters to plop together"></canvas>
  <div class="safe" data-safe></div>
  <a class="back" href="../" aria-label="Back to projects">‹</a>
  <div class="hud">
    <div class="best" data-best><small>best</small><b>A</b></div>
    <div class="actions">
      <div class="nc" data-nc title="Colours (changing restarts)"><button type="button" data-minus aria-label="Fewer colours">−</button><span data-dots></span><output></output><button type="button" data-plus aria-label="More colours">+</button></div>
      <button type="button" data-sound aria-label="Sound" title="Sound">🔊</button>
      <button type="button" data-reset title="Start over">↻</button>
    </div>
  </div>
  <div class="win over" data-over hidden><small>Game over</small><b>A</b><span>The screen is full. Best letter reached.</span><button type="button" data-over-again>Play again</button></div>
  <div class="win" data-win hidden><b>Z</b><span>You made a giant Z!</span><button type="button" data-again>Play again</button><button type="button" data-keep>Keep plopping</button></div>
  <script src="./plop.js?v=5"></script>
</body>
</html>
